name: Deploy Dhole Storage - Production

on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
  packages: read
concurrency:
  group: dhole-storage-production
  cancel-in-progress: false
env:
  COMPOSE_FILE: .dhole-system/deploy/docker-compose.services.yml
  STORAGE_PERSISTENCE_FILE: .github/storage-persistence.compose.yml
  DHOLE_IMAGE_TAG: latest
  DHOLE_NETWORK: dhole
  COMPOSE_PROJECT: dhole
jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, dhole]
    steps:
      - uses: actions/checkout@v4
      - name: Load Dhole deployment infrastructure
        run: |
          set -euo pipefail
          rm -rf .dhole-system
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 --branch master https://github.com/CustomCodeCR/DholeSystem.git .dhole-system; then
              break
            fi
            rm -rf .dhole-system
            if (( attempt == 5 )); then
              echo '::error::DholeSystem checkout unavailable after 5 attempts; inspect runner DNS and HTTPS.'
              getent ahostsv4 github.com || true
              exit 1
            fi
            echo "::warning::Transient checkout failure, retry $attempt/5"
            sleep $((attempt * 5))
          done
          test -f /opt/dhole/.env
          echo "DHOLE_ENV_FILE=/opt/dhole/.env" >> "$GITHUB_ENV"
      - name: Verify production server
        run: docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$STORAGE_PERSISTENCE_FILE" -p "$COMPOSE_PROJECT" config -q
      - name: Build images
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::12}"
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Storage.Api/Dockerfile -t dhole/storage-api:latest -t "dhole/storage-api:$SHA_TAG" .
          docker build --pull --build-arg GITHUB_ACTOR="$GITHUB_ACTOR" --secret id=github_token,env=GITHUB_TOKEN -f src/Dhole.Storage.Workers/Dockerfile -t dhole/storage-workers:latest -t "dhole/storage-workers:$SHA_TAG" .
      - name: Deploy Storage
        run: |
          set -euo pipefail
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$STORAGE_PERSISTENCE_FILE" -p "$COMPOSE_PROJECT" up -d --no-deps --force-recreate --pull never storage-api storage-workers
          docker compose --env-file "$DHOLE_ENV_FILE" -f "$COMPOSE_FILE" -f "$STORAGE_PERSISTENCE_FILE" -p "$COMPOSE_PROJECT" ps storage-api storage-workers
      - name: Cleanup old images
        run: docker image prune -f
